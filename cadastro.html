    <header id="home">
        <div>
            <img src="img/logo DC.png" alt="logo da ONG doe conhecimento" width="150px">

    <main>
        
        <form action="cadastro.html" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="nome">Nome Completo</label><br>
                <input type="text" name="nome" placeholder="nome" id="nome" required=""><br><br>
                <label for="email">E-mail</label>><br>
                <input type="email" name="email" placeholder="email@exemplo.com" id="email" required=""><br><br>
                <label for="tel">Telefone</label><br>
                <input type="number" name="tel" placeholder="(00) 00000-0000" id="numero" required=""><br><br>


                <p>Selecione se quer ser doador ou voluntário</p>
                
                <input type="radio" value="doador" name="tipo" id="doador" required="">
                <label for="pergunta">Doador</label>
                <input type="radio" value="voluntario" name="tipo" id="voluntario">
                <label for="pergunta">voluntário</label>
                
                <br><br>
                <button type="submit">Cadastrar</button>

            </fieldset>
        </form>
