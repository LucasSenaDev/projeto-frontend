<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header id="home">
        <div>
            <img src="img/logo-DC.png" alt="logo da ONG doe conhecimento" width="150">
            <h1>Doe Conhecimento</h1>
            <nav>
                <a href="index.html">Início</a>
                <a href="#contato">Contatos</a>
                <a href="projetos.html">Projetos</a>
            </nav>
            <a href="">se inscrever</a>
        </div>
    </header>


    <main>
        
        <form action="cadastro.html" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="nome">Nome Completo</label><br>
                <input type="text" name="nome" placeholder="nome" id="nome" required><br><br>
                <label for="email">E-mail</label><br>
                <input type="email" name="email" placeholder="email@exemplo.com" id="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"><br><br>
                <label for="tel">Telefone</label><br>
                <input type="tel" name="tel" placeholder="(00) 00000-0000" id="tel" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"><br><br>


                <p>Selecione se quer ser doador ou voluntário</p>
                
                <input type="radio" value="doador" name="tipo" id="doador" required>
                <label for="doador">Doador</label>
                <input type="radio" value="voluntario" name="tipo" id="voluntario">
                <label for="voluntario">voluntário</label>
                
                <br><br>
                <button type="submit">Cadastrar</button>

            </fieldset>
        </form>
    

    </main>

    <footer>
        <div id="contato"></div>
        <h2>Doe Conhecimento</h2>
        <p>Grupo criado em Curitiba em 2026 sem fins lucrativos.</p>

        <p> R. Waldemar Kost - Hauer, Curitiba - PR, 81610-100 <br>
        (41)90000-0000 <br>
        Curitiba - PR</p>
    </footer>
</body>
</html>
